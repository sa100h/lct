name: ML Broker Tests

# GitHub only reads workflows from the repo-root .github/workflows/.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ml-broker/**"
      - ".github/workflows/ml-broker-ci.yml"
  push:
    paths:
      - "ml-broker/**"

permissions:
  contents: read

jobs:
  unit:
    name: Queue worker unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest tests -q
