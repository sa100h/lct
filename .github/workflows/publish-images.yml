name: Publish Images

on:
  workflow_dispatch:
    inputs:
      publish_api_proxy:
        description: Publish api-proxy image
        required: true
        type: boolean
        default: false
      publish_app_service:
        description: Publish app-service image
        required: true
        type: boolean
        default: false
      publish_ml_service:
        description: Publish ml-service image
        required: true
        type: boolean
        default: false
      publish_default_branch_tag:
        description: Also publish the default branch tag
        required: true
        type: boolean
        default: true

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      image_namespace: ${{ steps.meta.outputs.image_namespace }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Validate selection
        shell: bash
        run: |
          if [[ "${{ inputs.publish_api_proxy }}" != "true" && "${{ inputs.publish_app_service }}" != "true" && "${{ inputs.publish_ml_service }}" != "true" ]]; then
            echo "Select at least one service." >&2
            exit 1
          fi
      - name: Derive metadata
        id: meta
        shell: bash
        run: |
          echo "image_namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Verify successful CI for commit
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'completed',
              per_page: 20,
            });
            if (!response.data.workflow_runs.some(run => run.conclusion === 'success')) {
              core.setFailed(`No successful CI run found for ${context.sha}.`);
            }

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-proxy
            enabled: ${{ inputs.publish_api_proxy }}
            dockerfile: api-proxy/Dockerfile
            image_name: service-template-api-proxy
          - service: app-service
            enabled: ${{ inputs.publish_app_service }}
            dockerfile: app-service/Dockerfile
            image_name: service-template-app-service
          - service: ml-service
            enabled: ${{ inputs.publish_ml_service }}
            dockerfile: ml-service/Dockerfile
            image_name: service-template-ml-service
    steps:
      - uses: actions/checkout@v4
        if: matrix.enabled == true
      - uses: docker/setup-buildx-action@v3
        if: matrix.enabled == true
      - uses: docker/login-action@v3
        if: matrix.enabled == true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare tags
        if: matrix.enabled == true
        id: tags
        shell: bash
        run: |
          image="ghcr.io/${{ needs.preflight.outputs.image_namespace }}/${{ matrix.image_name }}"
          echo 'value<<EOF' >> "$GITHUB_OUTPUT"
          echo "${image}:${{ needs.preflight.outputs.sha_tag }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.publish_default_branch_tag }}" == "true" && "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]]; then
            echo "${image}:${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: matrix.enabled == true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

