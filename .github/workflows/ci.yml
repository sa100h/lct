name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore template.slnx
      - name: Build
        run: dotnet build template.slnx -c Release --no-restore
      - name: Test
        run: dotnet test app-service/Tests/AppService.IntegrationTests.csproj -c Release --no-build

  ml:
    name: ML Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: web-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

  docker:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend, ml, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-proxy
            dockerfile: api-proxy/Dockerfile
            python_smoke: false
          - image: app-service
            dockerfile: app-service/Dockerfile
            python_smoke: false
          - image: ml-service
            dockerfile: ml-service/Dockerfile
            python_smoke: true
          - image: ml-broker
            dockerfile: ml-broker/Dockerfile
            python_smoke: true
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --file ${{ matrix.dockerfile }} --tag service-template/${{ matrix.image }}:ci-${{ github.sha }} .
      # Container-build correctness (Python images): the entrypoint is
      # overridden, so this proves the baked image boots python and the app
      # package imports cleanly (catches bad COPY paths, missing deps, and
      # Python-version drift) without needing the service's external
      # dependencies (DB, peer services). The app package lives at /app/app.
      - name: Smoke (boot python + import app inside built image)
        if: matrix.python_smoke
        run: |
          docker run --rm --entrypoint python \
            service-template/${{ matrix.image }}:ci-${{ github.sha }} \
            -c "import compileall,sys; sys.exit(0 if compileall.compile_dir('app', quiet=2) else 1)"
          docker run --rm --entrypoint python \
            service-template/${{ matrix.image }}:ci-${{ github.sha }} \
            -c "import app.main"

