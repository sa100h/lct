name: lct

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    #security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [app-network]

  test-event-feeder:
    build:
      context: .
      dockerfile: test-event-feeder/Dockerfile
    environment:
      FEED_ARCHIVE_PATH: /data/ext-journal-2026.7z
      FEED_CACHE_DIRECTORY: /cache
      FEED_SOURCE_START_AT: ${FEED_SOURCE_START_AT:-2026-01-01T00:00:00}
      FEED_CACHE_DURATION: ${FEED_CACHE_DURATION:-06:00:00}
      FEED_TIME_ZONE: ${FEED_TIME_ZONE:-Europe/Moscow}
    volumes:
      - ./ext-journal-2026.7z:/data/ext-journal-2026.7z:ro
      - event_feed_cache:/cache
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [app-network]

