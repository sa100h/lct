  api-proxy:
    build:
      context: .
      dockerfile: api-proxy/Dockerfile
      target: local
      # args:
      #   VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY}
    ports: ["${API_PROXY_HTTP_PORT:-80}:8080", "${API_PROXY_HTTPS_PORT:-443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTPS_PORT: ${API_PROXY_HTTPS_PORT:-443}
      VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY}
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /https/fullchain.pem
      Kestrel__Endpoints__Https__Certificate__KeyPath: /https/privkey.pem
      Observability__OtlpEndpoint: ""
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
    volumes:
      - ${JWT_KEYS_PATH:-./.keys}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app-service: { condition: service_started }
    restart: unless-stopped
    networks: [app-network]

  app-service:
    build:
      context: .
      dockerfile: app-service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDb: Host=postgres;Port=5432;Database=app_db;Username=app_service;Password=${APP_DB_PASSWORD}
      Migrations__Path: /migrations/app_db
      MlService__BaseUrl: http://ml-service:8000
      EventFeed__Enabled: "true"
      EventFeed__BaseUrl: http://test-event-feeder:8000
      EventFeed__PollInterval: 00:05:00
      EventFeed__RetryInterval: 00:00:10
      EventFeed__Lookback: 00:07:00
      EventFeed__PageSize: "1000"
      EventFeed__RequestTimeout: 00:00:30
      Observability__OtlpEndpoint: ""
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__PrivateKeyPath: /run/secrets/jwt-private.pem
      Jwt__AccessLifetimeMinutes: "5"
      Jwt__RefreshLifetimeDays: "7"
      Ad__Host: ${AD_TLS_HOSTNAME:-dc1.lct.ru}
      Ad__CertificatePath: /run/certs/ldaps.pem
      Ad__BindPassword: ${AD_BIND_PASSWORD:?Set AD_BIND_PASSWORD in .env}
      AuthCookie__Name: ${AUTH_REFRESH_COOKIE_NAME:-lct_refresh}
      AuthCookie__Path: ${AUTH_REFRESH_COOKIE_PATH:-/api/app/auth}
    volumes:
      - ./postgres-db/migrations:/migrations:ro
      - ${JWT_KEYS_PATH:-./.keys}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - ${JWT_KEYS_PATH:-./.keys}/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ad_public_certs:/run/certs:ro
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      test-event-feeder: { condition: service_healthy }
    restart: unless-stopped
    networks: [app-network]

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      ML_HORIZON_HOURS: "24"
    volumes:
      - ml_models:/app/models
      - ./ml-data:/app/data:ro
    read_only: true
    tmpfs: ["/tmp:size=100M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [app-network]

  ml-broker:
    build:
      context: .
      dockerfile: ml-broker/Dockerfile
    environment:
      DB_DSN: host=postgres port=5432 dbname=app_db user=app_service password=${APP_DB_PASSWORD}
      ML_BASE_URL: http://ml-service:8000
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    restart: unless-stopped
    networks: [app-network]

  ad:
    build:
      context: .
      dockerfile: ad/Dockerfile
    hostname: dc1
    domainname: LCT.RU
    privileged: true
    restart: unless-stopped
    dns:
      - 127.0.0.1
    environment:
      - DOMAIN=${DOMAIN}
      - DOMAINPASS=${DOMAINPASS}
      - AD_BIND_PASSWORD=${AD_BIND_PASSWORD:?Set AD_BIND_PASSWORD in .env}
      - AD_TLS_HOSTNAME=${AD_TLS_HOSTNAME:-dc1.lct.ru}
      - DNSFORWARDER=${DNSFORWARDER}
      - HOSTIP=${HOSTIP}
      - JOIN=${JOIN}
    volumes:
      - ad_data:/var/lib/samba
      - ad_config:/etc/samba/external
      - ad_public_certs:/ad-public-certificates
    networks:
      app-network:
        aliases: [dc1.lct.ru]

volumes:
  postgres_data:
  event_feed_cache:
  # loki_data:
  # prometheus_data:
  # tempo_data:
  # grafana_data:
  ml_models:
  ad_data:
  ad_config:
  ad_public_certs:

networks:
  app-network:
    driver: bridge
