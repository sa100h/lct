name: lct

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [app-network]

  test-event-feeder:
    build:
      context: .
      dockerfile: test-event-feeder/Dockerfile
    environment:
      FEED_ARCHIVE_PATH: /data/ext-journal-2026.7z
      FEED_CACHE_DIRECTORY: /cache
      FEED_SOURCE_START_AT: ${FEED_SOURCE_START_AT:-2026-01-01T00:00:00}
      FEED_CACHE_DURATION: ${FEED_CACHE_DURATION:-06:00:00}
      FEED_TIME_ZONE: ${FEED_TIME_ZONE:-Europe/Moscow}
    volumes:
      - ./ext-journal-2026.7z:/data/ext-journal-2026.7z:ro
      - event_feed_cache:/cache
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [app-network]

  loki:
    profiles: [observability]
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks: [app-network]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks: [app-network]

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      loki: { condition: service_started }
      tempo: { condition: service_started }
    restart: unless-stopped
    networks: [app-network]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks: [app-network]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.6.0
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks: [app-network]

  promtail:
    profiles: [observability]
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/config.yaml", "-config.expand-env=true"]
    environment:
      DEPLOYMENT_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      - ./observability/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [app-network]

  node-exporter:
    profiles: [observability]
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    networks: [app-network]

  api-proxy:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/service-template-api-proxy:${API_PROXY_IMAGE_TAG}
    pull_policy: always
    ports: ["${API_PROXY_HTTP_PORT:-80}:8080", "${API_PROXY_HTTPS_PORT:-443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTPS_PORT: ${API_PROXY_HTTPS_PORT:-443}
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /https/fullchain.pem
      Kestrel__Endpoints__Https__Certificate__KeyPath: /https/privkey.pem
      Observability__OtlpEndpoint: ""
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
    volumes:
      - ${CERTS_PATH:-./certs}:/https:ro
      - ${JWT_KEYS_PATH:-./.keys}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app-service: { condition: service_started }
    restart: unless-stopped
    networks: [app-network]

  app-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/service-template-app-service:${APP_SERVICE_IMAGE_TAG}
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__AppDb: Host=postgres;Port=5432;Database=app_db;Username=app_service;Password=${APP_DB_PASSWORD}
      Migrations__Path: /migrations/app_db
      MlService__BaseUrl: http://ml-service:8000
      EventFeed__Enabled: "true"
      EventFeed__BaseUrl: http://test-event-feeder:8000
      EventFeed__PollInterval: 00:05:00
      EventFeed__RetryInterval: 00:00:10
      EventFeed__Lookback: 00:07:00
      EventFeed__PageSize: "1000"
      EventFeed__RequestTimeout: 00:00:30
      Observability__OtlpEndpoint: ""
      Jwt__PublicKeyPath: /run/secrets/jwt-public.pem
      Jwt__PrivateKeyPath: /run/secrets/jwt-private.pem
      Jwt__AccessLifetimeMinutes: "5"
      Jwt__RefreshLifetimeDays: "7"
      AuthCookie__Name: ${AUTH_REFRESH_COOKIE_NAME:-lct_refresh}
      AuthCookie__Path: ${AUTH_REFRESH_COOKIE_PATH:-/api/app/auth}
    volumes:
      - ./postgres-db/migrations:/migrations:ro
      - ${JWT_KEYS_PATH:-./.keys}/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - ${JWT_KEYS_PATH:-./.keys}/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      test-event-feeder: { condition: service_healthy }
    restart: unless-stopped
    networks: [app-network]

  ml-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/service-template-ml-service:${ML_SERVICE_IMAGE_TAG}
    pull_policy: always
    environment:
      ML_HORIZON_HOURS: "24"
      # Data root = the compose mount point, NOT a dev-box absolute path (see
      # ml-service/app/config.py).
      LCT_DATA_DIR: /app/data
      # A missing parquet inside the container means a broken mount — refuse the
      # synthetic fallback instead of replacing the trained model with a stub.
      LCT_ALLOW_SYNTHETIC: "false"
    volumes:
      - ml_models:/app/models
      - ./ml-data:/app/data:ro
    read_only: true
    tmpfs: ["/tmp:size=100M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [app-network]

  ml-broker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/service-template-ml-broker:${ML_BROKER_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      DB_DSN: host=postgres port=5432 dbname=app_db user=app_service password=${APP_DB_PASSWORD}
      ML_BASE_URL: http://ml-service:8000
      FORECAST_BATCH_CHUNK: ${FORECAST_BATCH_CHUNK:-300}
      PREDICT_TIMEOUT_SECONDS: ${PREDICT_TIMEOUT_SECONDS:-600}
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    restart: unless-stopped
    networks: [app-network]

volumes:
  postgres_data:
  event_feed_cache:
  loki_data:
  prometheus_data:
  tempo_data:
  grafana_data:
  ml_models:

networks:
  app-network:
    driver: bridge
