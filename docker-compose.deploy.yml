name: service-template

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [app-network]

  loki:
    profiles: [observability]
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks: [app-network]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks: [app-network]

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      loki: { condition: service_started }
      tempo: { condition: service_started }
    restart: unless-stopped
    networks: [app-network]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks: [app-network]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.6.0
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks: [app-network]

  promtail:
    profiles: [observability]
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/config.yaml", "-config.expand-env=true"]
    environment:
      DEPLOYMENT_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      - ./observability/promtail/config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [app-network]

  node-exporter:
    profiles: [observability]
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    networks: [app-network]

  api-proxy:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/service-template-api-proxy:${API_PROXY_IMAGE_TAG}
    pull_policy: always
    ports: ["${API_PROXY_HTTP_PORT:-80}:8080", "${API_PROXY_HTTPS_PORT:-443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTPS_PORT: ${API_PROXY_HTTPS_PORT:-443}
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: ${KESTREL_CERTIFICATE_PATH:-/https/aspnetapp.pfx}
      Kestrel__Endpoints__Https__Certificate__Password: ${KESTREL_CERTIFICATE_PASSWORD}
      Observability__OtlpEndpoint: ""
    volumes:
      - ${CERTS_PATH:-./certs}:/https:ro
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app-service: { condition: service_started }
    restart: unless-stopped
    networks: [app-network]

  app-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/service-template-app-service:${APP_SERVICE_IMAGE_TAG}
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__AppDb: Host=postgres;Port=5432;Database=app_db;Username=app_service;Password=${APP_DB_PASSWORD}
      Migrations__Path: /migrations/app_db
      MlService__BaseUrl: http://ml-service:8000
      Observability__OtlpEndpoint: ""
    volumes:
      - ./postgres-db/migrations:/migrations:ro
    read_only: true
    tmpfs: ["/tmp:size=50M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [app-network]

  ml-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/service-template-ml-service:${ML_SERVICE_IMAGE_TAG}
    pull_policy: always
    environment:
      ML_HORIZON_HOURS: "24"
    volumes:
      - ml_models:/app/models
      - ./ml-data:/app/data:ro
    read_only: true
    tmpfs: ["/tmp:size=100M"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [app-network]

volumes:
  postgres_data:
  loki_data:
  prometheus_data:
  tempo_data:
  grafana_data:
  ml_models:

networks:
  app-network:
    driver: bridge
